<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lecture.pdf</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { color: #111827; background: #f6f7f9; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { box-sizing: border-box; min-height: 56px; padding: 14px 18px; display: flex; gap: 12px; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #d9dde5; }
    h1 { margin: 0; font-size: 18px; font-weight: 650; }
    a { color: #0f5bd7; font-weight: 600; text-decoration: none; white-space: nowrap; }
    a:hover { text-decoration: underline; }
    main { height: calc(100% - 57px); }
    iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  </style>
</head>
<body>
  <header>
    <h1>lecture.pdf</h1>
    <a href="lecture.pdf" download>PDF 다운로드</a>
  </header>
  <main>
    <iframe src="lecture.pdf" title="lecture.pdf"></iframe>
  </main>
</body>
</html>
